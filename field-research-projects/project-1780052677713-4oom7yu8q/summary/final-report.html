<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>田野调查总结报告 - 11</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: #1890ff;
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .header p {
      margin: 10px 0 0;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    .section {
      margin-bottom: 30px;
    }
    .section h2 {
      color: #1890ff;
      border-bottom: 2px solid #1890ff;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #1890ff;
    }
    .stat-label {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .comparison-table th,
    .comparison-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .comparison-table th {
      background: #f8f9fa;
      font-weight: 600;
    }
    .positive {
      color: #52c41a;
    }
    .negative {
      color: #ff4d4f;
    }
    .suggestions {
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 8px;
      padding: 20px;
    }
    .suggestions h3 {
      color: #fa8c16;
      margin-top: 0;
    }
    .suggestions ul {
      margin: 0;
      padding-left: 20px;
    }
    .suggestions li {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>田野调查总结报告</h1>
      <p>项目：11</p>
      <p>时间：2026-05-29 至 2026-05-29</p>
    </div>

    <div class="content">
      <div class="section">
        <h2>完成情况</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">0.0%</div>
            <div class="stat-label">完成率</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">0</div>
            <div class="stat-label">实际完成点位</div>
          </div>
          <div class="stat-card">
            <div class="stat-value positive">
              +0
            </div>
            <div class="stat-label">点位差异</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>行程统计</h2>
        <table class="comparison-table">
          <thead>
            <tr>
              <th>指标</th>
              <th>计划</th>
              <th>实际</th>
              <th>差异</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>考察点位</td>
              <td>0 个</td>
              <td>0 个</td>
              <td class="positive">
                +0 个
              </td>
            </tr>
            <tr>
              <td>总里程</td>
              <td>0.0 公里</td>
              <td>0.0 公里</td>
              <td class="positive">
                +0.0 公里
              </td>
            </tr>
            <tr>
              <td>总天数</td>
              <td>0 天</td>
              <td>0 天</td>
              <td class="positive">
                +0 天
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section">
        <h2>平均数据</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">0.0</div>
            <div class="stat-label">每日点位数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">0.0</div>
            <div class="stat-label">每日工作时长</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">0.0</div>
            <div class="stat-label">每日里程</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>改进建议</h2>
        <div class="suggestions">
          <h3>基于本次调查的建议</h3>
          <ul>
            <li>每日点位数量较少，可考虑增加至 2-3 个，提高效率</li>
            <li>每日工作时长较短，可考虑适当延长，充分利用时间</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
